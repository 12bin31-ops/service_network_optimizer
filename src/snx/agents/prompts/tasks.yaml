diagnose_demand:
  description: >
    도구를 사용해 전국 요약 지표와 갭 상위 {top_n}개 지역의 상세 지표를 가져온다.
    각 지역에 대해 다음을 규명한다.
      1) 연간 정비 수요 규모와 그 수요를 만든 차령 구조 (노후차량 비중)
      2) 미충족 수요가 '접근 공백'에서 오는지 '용량 초과'에서 오는지
      3) 인구 규모 대비 수요가 과대/과소한 지역이 있다면 그 이유
    모든 수치는 도구 결과에서만 인용한다. 도구에 없는 값은 언급하지 않는다.
  expected_output: >
    지역별 진단 노트. 각 지역 3~4문장, 수치를 문장 안에 직접 인용할 것.
  agent: demand_analyst

evaluate_network:
  description: >
    도구로 최신 입지 최적화 결과를 가져와 다음을 판정한다.
      1) 신규 거점 배치안이 미충족 수요의 몇 %를 흡수하는가
      2) 갭 순위 상위인데 신규 거점에 선정되지 않은 지역이 있다면 그 이유
         (인접 거점이 이미 덮음 / 용량 갭이라 증설이 맞음 등)
      3) 접근성 갭 지역과 용량 갭 지역에 각각 다른 처방을 제시
      4) 이 배치안의 리스크 한 가지
    앞 단계의 진단 노트를 근거로 삼되, 숫자는 도구 결과를 따른다.
  expected_output: >
    전략 판정 노트. 처방은 '신설' 과 '증설' 로 명확히 구분해 제시할 것.
  agent: network_strategist

write_report:
  description: >
    앞선 진단과 전략 판정을 임원 보고용 한국어 마크다운 문서로 작성한다.
    구조는 다음을 따른다.
      ## 결론      — 3개 이내 불릿, 각 불릿에 숫자 포함
      ## 진단      — 전국 요약 + 갭 상위 지역 표
      ## 처방      — 신설 대상 / 증설 대상 구분
      ## 가정과 한계 — methodology_notes 도구 결과를 근거로 3개 이내
    과장된 형용사를 쓰지 않는다. 확인되지 않은 수치를 만들지 않는다.
    문서 전체 1,200자 이내.
  expected_output: >
    완성된 마크다운 문서 본문만 출력. 코드펜스나 부연 설명 없이.
  agent: report_writer
