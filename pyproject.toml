[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "service-network-optimizer"
version = "0.2.0"
description = "Service Network Optimizer — 정비 수요 예측 · 커버리지 갭 · 거점 품질 · 신설/증설 투자 최적화"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "박수빈" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.0",
    "pulp>=2.8,<4.0",
    "scikit-learn>=1.3",
    "folium>=0.15",
    "streamlit>=1.30",
    "plotly>=5.18",
]

[project.optional-dependencies]
agents = ["crewai>=0.60", "langchain-openai>=0.1", "python-dotenv>=1.0"]
ml = ["lightgbm>=4.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]

[project.scripts]
snx = "snx.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
snx = ["agents/prompts/*.yaml", "storage/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # PuLP 3.x 가 4.0 API 이행을 예고하는 경고 — 동작에는 영향 없음 (의존성 <4.0 고정)
    "ignore::DeprecationWarning:pulp.*",
]
